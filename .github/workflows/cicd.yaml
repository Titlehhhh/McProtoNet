name: cicd.yaml
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release/*
    tags:
      - "v*"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Run tests
        run: dotnet run --project tests/McProtoNet.Tests -c Release

  tests-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Run crypto tests on ARM64
        run: dotnet run --project tests/McProtoNet.Tests -c Release -- -namespace McProtoNet.Tests.Cryptography

  publish-nuget:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [tests, tests-arm64]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
          
      - name: Test, pack, validate and push to nuget.org
        run: ./build.cmd Push --Configuration Release --NugetApiUrl https://api.nuget.org/v3/index.json --NugetApiKey ${{secrets.NUGET_TOKEN}}

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/nuget/*.nupkg
          retention-days: 90
          if-no-files-found: ignore
