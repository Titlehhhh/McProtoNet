name: Build documentation

# Автозапуска нет намеренно: сайт публикуется только вручную,
# кнопкой "Run workflow" во вкладке Actions.
#
# Публикуются оба сайта сразу: старая документация Writerside в корне
# Pages, новая на Docusaurus - в подпапке /next/.
on:
  workflow_dispatch:

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write

env:
  # Локатор экшена принимает ровно <module>/<product>, поэтому папка проекта
  # передаётся отдельно через location, а не склеивается с инстансом.
  WS_LOCATION: 'docs'
  WS_INSTANCE: 'legacy-writerside/in'
  DOCKER_VERSION: '243.22562'

jobs:
  legacy:
    name: Writerside (корень сайта)
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.define-ids.outputs.artifact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Define instance id and artifact
        id: define-ids
        run: |
          # Имя архива собирается из идентификатора инстанса, без модуля.
          INSTANCE_ID=${WS_INSTANCE##*/}
          INSTANCE_ID_UPPER=$(echo "$INSTANCE_ID" | tr '[:lower:]' '[:upper:]')
          ARTIFACT="webHelp${INSTANCE_ID_UPPER}2-all.zip"
          echo "ARTIFACT: $ARTIFACT"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Build docs using Writerside Docker builder
        uses: JetBrains/writerside-github-action@v4
        with:
          location: ${{ env.WS_LOCATION }}
          instance: ${{ env.WS_INSTANCE }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Save artifact with build results
        uses: actions/upload-artifact@v4
        with:
          name: legacy-docs
          path: artifacts/${{ steps.define-ids.outputs.artifact }}
          retention-days: 7

  site:
    name: Docusaurus (/next/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Docusaurus читает git-историю ради «последнее обновление»;
          # при глубине 1 даты будут пустые.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Install docfx
        run: |
          dotnet tool install -g docfx
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      # Справка API не лежит в git: docfx собирает метаданные из проектов,
      # скрипт разворачивает их в страницы. Без этих двух шагов раздел
      # "Справка API" на сайте пустой.
      - name: Collect API metadata
        run: npm run metadata

      - name: Generate API pages
        run: npm run api

      - name: Build site
        run: npm run build

      - name: Save artifact with build results
        uses: actions/upload-artifact@v4
        with:
          name: next-docs
          path: docs/site/build
          retention-days: 7

  deploy:
    needs: [legacy, site]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Writerside artifact
        uses: actions/download-artifact@v4
        with:
          name: legacy-docs
          path: artifacts

      - name: Unzip Writerside artifact into the site root
        run: unzip -O UTF-8 -qq "artifacts/${{ needs.legacy.outputs.artifact }}" -d public

      - name: Download Docusaurus artifact into /next/
        uses: actions/download-artifact@v4
        with:
          name: next-docs
          path: public/next

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
