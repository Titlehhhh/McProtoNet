name: Build documentation

# Публикуется сайт на Docusaurus: он в корне Pages, то есть на
# titlehhhh.github.io/McProtoNet/. Старая документация Writerside вырезана
# из репозитория (docs/legacy-writerside), отдельного второго сайта больше
# нет.
on:
  push:
    branches:
      - master
      - dev
    paths:
      - 'docs/**'
      - '.github/workflows/gh-pages.yaml'
  workflow_dispatch:

# Группа общая на все ветки: пуш в dev и пуш в master иначе деплоят
# одновременно и перезаписывают друг друга.
concurrency:
  group: gh-pages
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  site:
    name: Docusaurus (site root)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Docusaurus читает git-историю ради «последнее обновление»;
          # при глубине 1 даты будут пустые.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Install docfx
        run: |
          dotnet tool install -g docfx
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      # Справка API не лежит в git: docfx собирает метаданные из проектов,
      # скрипт разворачивает их в страницы. Без этих двух шагов раздел
      # "Справка API" на сайте пустой.
      - name: Collect API metadata
        run: npm run metadata

      - name: Generate API pages
        run: npm run api

      - name: Build site
        run: npm run build

      - name: Save artifact with build results
        uses: actions/upload-artifact@v4
        with:
          name: site-docs
          path: docs/site/build
          retention-days: 7

  deploy:
    needs: [site]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Docusaurus artifact into the site root
        uses: actions/download-artifact@v4
        with:
          name: site-docs
          path: public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
